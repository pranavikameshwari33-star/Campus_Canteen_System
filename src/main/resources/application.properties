spring.application.name=campus-canteen

# ---------- MongoDB ----------
# The connection string comes from the MONGODB_URI environment variable (never hardcode it here).
# It is read by config/MongoConfig.java.
# Database name. Override with the MONGODB_DATABASE environment variable if you want a different one.
spring.mongodb.database=${MONGODB_DATABASE:campus_canteen}
# Collections and indexes are created by DatabaseInitializer, so automatic index creation is off.
spring.data.mongodb.auto-index-creation=false
# Store money values (BigDecimal) as exact decimals in MongoDB.
spring.data.mongodb.representation.big-decimal=DECIMAL128

# ---------- Web server ----------
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Hard upload limit. The application itself only accepts images up to 5 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# How much of a rejected (too large) upload the server still reads, so the browser receives the
# "image is too large" message instead of a dropped connection.
server.tomcat.max-swallow-size=100MB

# ---------- Canteen application settings ----------
# Time zone used to decide today's date, the active meal session and token resets.
app.timezone=${CANTEEN_TIMEZONE:Asia/Kolkata}
# Folder where payment screenshots and the payment QR image are saved (relative to the project folder).
app.upload-dir=${CANTEEN_UPLOAD_DIR:uploads}

# First administrator setup. Leave these environment variables unset normally.
# See README.md ("Creating the first administrator").
app.admin-setup.college-id=${CANTEEN_ADMIN_ID:}
app.admin-setup.name=${CANTEEN_ADMIN_NAME:}
app.admin-setup.password=${CANTEEN_ADMIN_PASSWORD:}
# Optional: if set, the first administrator must type this code on /admin/register.
app.admin-setup.setup-code=${CANTEEN_SETUP_CODE:}
# Optional, LOCAL DEVELOPMENT ONLY: a reusable administrator invitation code. Off unless the
# CANTEEN_ADMIN_INVITATION_CODE environment variable is set, and even then it is accepted only when
# MongoDB runs on this computer and /admin/register is opened on this computer (localhost).
# Never set it on a deployed server. See README.md ("Local-development invitation code").
app.admin-setup.invitation-code=${CANTEEN_ADMIN_INVITATION_CODE:}

# ---------- Logging ----------
logging.level.org.mongodb.driver=WARN
